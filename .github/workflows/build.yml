name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version (e.g. 1.2.3)'
        required: true
        type: string

jobs:
  build:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build --configuration Release /p:Version=${{ inputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack --configuration Release --no-build /p:Version=${{ inputs.version }} --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/
